name: Build release package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install cross compiler
        run: brew install mingw-w64
      - name: Build proxy, verifier, and universal macOS installer
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            make release verify.exe VERSION="$VERSION"
          else
            make release verify.exe
          fi
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: gow-crossover-depth-fix-macos
          path: dist/*
          if-no-files-found: error
